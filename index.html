<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TravelHaven Caribbean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#f6f6f4;--fg:#111312;--muted:#6a6f6c;--line:#e3e4e1;
  --accent:#0f5c4d;--accent-fg:#fff;--ink:#111312;--ink-fg:#fff;--warn:#8a5a00;--warnbg:#fbf1dc;--bad:#a3271d;--badbg:#fbe5e2;--okbg:#e2f1ec;
  --font-display:'Cormorant Garamond','Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e100f;--surface:#171a19;--fg:#f1f2ef;--muted:#9aa09c;--line:#2a2d2b;
  --accent:#5fc3ad;--accent-fg:#0b1512;--ink:#f1f2ef;--ink-fg:#0e100f;--warn:#f3c56f;--warnbg:#33290f;--bad:#ff9d93;--badbg:#3a1714;--okbg:#14302a;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.08;margin:0}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-family:var(--font-display);font-size:26px;font-weight:600;text-decoration:none;white-space:nowrap}
.logo span{font-style:italic;font-weight:500;color:var(--accent)}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.buyband{background:#13261f;color:#fff;margin-top:8px}
.buyband .eyebrow{color:#f2c38a}.buyband .fine{color:rgba(255,255,255,.75)}
.buyband .btn.solid{background:#fff;color:#111;border-color:#fff}
.buyband .card,.buyband .loc,.buyband .facts{color:inherit}.buyband .loc,.buyband .facts{opacity:.8}.buyband .by{border-top-color:rgba(255,255,255,.2)}
.buyband .av{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.hero-tabs{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.hero-tabs button{color:#fff;padding:7px 14px;font-size:14px}
.hero-tabs button[aria-pressed="true"]{background:#fff;color:#111}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.who b{display:block;color:var(--fg);font-size:13px}

/* bottom nav (mobile-first) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom a{flex:1;text-align:center;text-decoration:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 2px 9px}
nav.bottom a .i{display:block;font-size:18px;line-height:1.1;margin-bottom:2px}
nav.bottom a[aria-current="page"]{color:var(--fg);font-weight:600}

/* buttons & forms */
.btn{display:inline-block;text-align:center;text-decoration:none;border:1px solid var(--fg);background:none;padding:11px 18px;cursor:pointer;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:0}
.btn:hover{background:var(--ink);color:var(--ink-fg)}
.btn.solid{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:7px 11px;font-size:11px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:var(--bad);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
label.f{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);padding:11px 12px;border-radius:0}
textarea.in{min-height:96px;resize:vertical}
.form{display:grid;gap:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{display:flex;gap:9px;align-items:center;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{border:1px solid var(--line);padding:7px 11px;font-size:13.5px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chips input{accent-color:var(--accent);margin:0}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:1.2em}
.fine{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.sec{padding-top:36px;padding-bottom:36px}
.sec h2{font-size:clamp(28px,6vw,42px)}
.panel{border:1px solid var(--line);padding:20px;background:var(--bg)}
.panel+.panel{margin-top:16px}
.panel h3{font-size:24px;margin-bottom:10px}

/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(180deg,#16465a 0%,#d98a5f 52%,#f2c38a 56%,#1e6c80 57%,#0a2f3d 100%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.hero .wrap{position:relative;z-index:1}
.hero .wrap{padding-top:44px;padding-bottom:32px}
.hero h1{font-size:clamp(36px,9vw,68px);max-width:15ch}
.hero p{margin:12px 0 22px;max-width:44ch;opacity:.92;font-size:16px}
.search{background:var(--bg);color:var(--fg);display:grid;grid-template-columns:1fr 1fr;max-width:980px}
.search .field{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.search .field label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.search .field select,.search .field input{width:100%;border:0;background:transparent;padding:3px 0;font-size:15px}
.search .go{grid-column:1/-1;border:0;background:var(--ink);color:var(--ink-fg);padding:15px;cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase}

/* cards */
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.count{color:var(--muted);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr;gap:28px 22px}
.card{cursor:pointer;display:block;text-decoration:none;min-width:0}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .nm{position:absolute;left:14px;bottom:12px;right:60px;color:#fff;font-family:var(--font-display);font-size:22px;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.badge{position:absolute;left:12px;top:12px;background:var(--bg);color:var(--fg);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:17px}
.heart[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.meta{padding-top:12px}
.price{font-family:var(--font-display);font-size:25px;font-weight:600;line-height:1.1}
.price small{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted)}
.card h3{font-family:var(--font-body);margin:5px 0 2px;font-size:16px;font-weight:500;line-height:1.3}
.loc{color:var(--muted);font-size:13.5px}
.facts{display:flex;gap:12px;margin-top:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.by{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.av{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid var(--line);flex:none}
.ver{margin-left:auto;color:var(--accent);font-size:12px}
.empty{padding:44px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* filters */
.filters{border:1px solid var(--line);padding:16px;margin-bottom:22px}
.filters summary{cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.filters .form{margin-top:14px}

/* property page */
.gal{display:grid;grid-template-columns:1fr;gap:4px}
.gal .ph:first-child{aspect-ratio:4/3}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:6px}
.thumbs button{border:0;padding:0;width:84px;height:62px;flex:none;cursor:pointer;background:var(--surface);opacity:.7}
.thumbs button[aria-current="true"]{opacity:1;outline:2px solid var(--fg)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pp{display:grid;grid-template-columns:1fr;gap:28px;margin-top:22px}
.pp h1{font-size:clamp(32px,7vw,48px)}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0}
.specs div{background:var(--bg);padding:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.specs b{display:block;color:var(--fg);font-size:18px;font-weight:600;letter-spacing:0;text-transform:none}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;list-style:none;margin:10px 0 0}
.amen li{display:flex;gap:8px;font-size:14.5px}
.amen li::before{content:"";width:6px;height:6px;margin-top:8px;background:var(--accent);flex:none}
.book{border:1px solid var(--line);padding:20px;align-self:start}
.book h3{font-size:26px}
.book .grp{display:grid;gap:8px;margin-top:12px}
.book .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:16px}
.reveal{margin-top:8px;padding:10px 12px;background:var(--surface);font-size:14px;word-break:break-all}

/* dashboards */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 20px;scrollbar-width:none}
.tabs a{white-space:nowrap;text-decoration:none;padding:10px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--bg);padding:14px}
.kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1.1}
.list{border:1px solid var(--line)}
.item{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .sw{width:64px;height:52px;flex:none;background:var(--surface);background-size:cover;background-position:center}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;font-weight:600;background:var(--surface);color:var(--muted)}
.st.approved,.st.active,.st.trial{background:var(--okbg);color:var(--accent)}
.st.pending,.st.past_due{background:var(--warnbg);color:var(--warn)}
.st.rejected,.st.cancelled,.st.expired,.st.suspended,.st.removed{background:var(--badbg);color:var(--bad)}
.st.paused{background:var(--surface);color:var(--muted)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.stats b{color:var(--fg)}
.stats span{white-space:nowrap}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:12px;background:var(--surface)}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar em{font-style:normal;text-align:right;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:10px}
.spark i{flex:1;background:var(--accent);min-height:2px;opacity:.85}
.steps{display:flex;gap:6px;margin:16px 0 22px}
.steps i{flex:1;height:3px;background:var(--line)}
.steps i.on{background:var(--fg)}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pics div{position:relative;aspect-ratio:1;background:var(--surface)}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.pics button{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}
.pics button.mk{left:4px;right:auto;top:auto;bottom:4px;width:auto;height:auto;border-radius:0;background:var(--bg);color:var(--fg);padding:3px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.pics .cover{position:absolute;left:4px;bottom:4px;background:var(--bg);font-size:10px;padding:2px 5px;text-transform:uppercase;letter-spacing:.06em}
.optrow{border:1px solid var(--line);padding:12px}
.optrow .in{margin-top:8px}
.notice{padding:12px 14px;font-size:14px;background:var(--warnbg);color:var(--warn)}
.notice.ok{background:var(--okbg);color:var(--accent)}
.notice.bad{background:var(--badbg);color:var(--bad)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end;overflow-y:auto}
.sheet{background:var(--bg);width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));position:relative}
.sheet h3{font-size:26px;margin-bottom:8px;padding-right:36px}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:var(--surface);cursor:pointer;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--ink-fg);padding:12px 18px;font-size:14px;max-width:calc(100% - 32px)}
footer{padding:36px 0 28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:30px}

@media (min-width:700px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .pics{grid-template-columns:repeat(4,1fr)}
  .scrim{align-items:center}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .search{grid-template-columns:repeat(6,1fr)}
  .search .go{grid-column:auto}
  .pp{grid-template-columns:1.5fr 1fr}
  .gal{grid-template-columns:2fr 1fr}
}
@media (max-width:520px){.who{display:none}.top .wrap{gap:8px}.top .right{gap:8px}.listbtn{padding:8px 9px;font-size:10.5px;letter-spacing:.04em;white-space:nowrap}.seg button{padding:5px 8px}}
@media (max-width:440px){.top .logo span{display:none}}
@media (max-width:380px){.logo{font-size:22px}}
@media (max-width:699px){.search .field:nth-child(5){grid-column:1/-1}}

/* messaging */
nav.bottom a .i{position:relative}
.nb{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font:600 10px/16px var(--font-body);letter-spacing:0}
.nb[hidden]{display:none}
a.item.thr{text-decoration:none;color:inherit;align-items:center}
.thr-top{display:flex;justify-content:space-between;gap:8px}
.thr-last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.thr-last.new{color:var(--fg);font-weight:600}
.item .mid{min-width:0;flex:1}
.dot{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.chat-head{display:flex;gap:12px;align-items:center;margin-top:12px}
.chat-head .mid{min-width:0;flex:1}
.av{flex:none}
.more{position:relative}
.more summary{list-style:none;cursor:pointer;font-size:22px;padding:4px 10px;border:1px solid var(--line)}
.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:100%;z-index:5;background:var(--bg);border:1px solid var(--line);min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.more .menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font:inherit;color:var(--fg);cursor:pointer}
.more .menu button.bad{color:var(--bad)}
.msgs{display:flex;flex-direction:column;gap:6px;padding:16px 0;min-height:30vh}
.msgs .day{align-self:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0}
.bub{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:9px 12px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:3px;text-align:right}
.chatbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}
.chatbar textarea{flex:1;resize:none;min-height:44px;max-height:160px}
.chatbar .btn{flex:none}
@media (max-width:400px){nav.bottom a{font-size:10px;letter-spacing:.03em}}

/* photos */
.phcount{font-size:14px;color:var(--muted)}
.phcount b{color:var(--fg)}
.pics .mv{position:absolute;left:4px;top:4px;display:flex;gap:4px}
.pics .mv button{position:static;width:28px;height:28px;font-size:18px;line-height:1}
#wPicBtn.busy{opacity:.6;pointer-events:none}
.ph .gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:2}
.ph .gnav.prev{left:10px}.ph .gnav.next{right:10px}
.ph .gcount{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;letter-spacing:.04em;z-index:2}
.ph.gal{touch-action:pan-y}

/* photo sliding on listing cards */
.cgal{touch-action:pan-y}
.card .cnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font-size:22px;line-height:1;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card .cnav.prev{left:8px}.card .cnav.next{right:8px}
.cdots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;z-index:2;pointer-events:none}
.cdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.cdots i.on{background:#fff}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#home">TravelHaven <span>Caribbean</span></a>
  <div class="right">
    <div class="seg" role="group" aria-label="Currency"><button data-cur="USD" aria-pressed="true">US$</button><button data-cur="JMD" aria-pressed="false">J$</button></div>
    <div class="who" id="who"></div>

  return src ? `<img src="${src}" alt="Photo of ${esc(p.name)}">`
             : `<div style="position:absolute;inset:0;${bg(p)}"></div>${withName ? `<div class="nm">${esc(p.name)}</div>` : ""}`;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3800); }
function modal(html) { $("#sheet").innerHTML = `<button class="x" data-close aria-label="Close">×</button>` + html; $("#scrim").hidden = false; document.body.style.overflow = "hidden"; }
function closeModal() { $("#scrim").hidden = true; document.body.style.overflow = ""; }
function me() {
  const a = DB.state.user; if (!a) return null;
  const u = DB.find("users", "userId", a.uid) || { userId: a.uid, name: (a.email || "").split("@")[0], email: a.email, accountType: "guest", country: "", status: "active", createdAt: Date.now() };
  return DB.state.isAdmin ? Object.assign(u, { _admin: true }) : u;
}
function role() { const u = me(); return !u ? "visitor" : DB.state.isAdmin ? "admin" : u.accountType; }
function favKey() { const u = me(); return u ? u.userId : "device"; }
function isFav(pid) { return DB.all("favorites").some(f => f.userId === favKey() && f.propertyId === pid); }
function toggleFav(pid) {
  const k = favKey(), on = !isFav(pid);
  if (k === "device") DB.deviceFav(pid, on);
  else if (on) DB.insert("favorites", { favId: k + "_" + pid, userId: k, propertyId: pid });
  else DB.remove("favorites", "favId", k + "_" + pid);
  return on;
}
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }

/* ---------- navigation ---------- */
function nav(cur) {
  const r = role();
  const ib = ["inbox", "✉", "Inbox"];
  let items = [["home", "⌂", "Explore"], ["search", "⌕", "Stays"], ["buy", "◈", "Buy"], ["favorites", "♡", "Saved"], ["account", "○", "Account"]];
  if (r === "guest") items = [["home", "⌂", "Explore"], ["search", "⌕", "Stays"], ["buy", "◈", "Buy"], ["favorites", "♡", "Saved"], ib, ["account", "○", "Account"]];
  if (r === "host") items = [["home", "⌂", "Explore"], ["host", "▦", "Dashboard"], ["host-add", "+", "Add"], ib, ["account", "○", "Account"]];
  if (r === "admin") items = [["home", "⌂", "Explore"], ["admin", "▦", "Admin"], ["admin-properties", "☰", "Listings"], ib, ["account", "○", "Account"]];
  $("#bnav").innerHTML = items.map(([h, i, t]) => `<a href="#${h}" ${cur === h || (cur.startsWith(h + "-") && h !== "host" && h !== "admin") ? 'aria-current="page"' : ""}><span class="i" aria-hidden="true">${i}${h === "inbox" ? `<b class="nb" data-inbox-badge hidden></b>` : ""}</span>${t}</a>`).join("");
  Chat.badge();
  const lb = $("#listBtn");
  lb.href = r === "host" ? "#host-add" : r === "admin" ? "#admin-properties" : "#host-join";
  lb.textContent = r === "admin" ? "Listings" : "+ List property";
  lb.setAttribute("aria-current", (cur === "host-add" || cur === "host-join") ? "page" : "false");
  const u = me();
  $("#who").innerHTML = u ? `<b>${esc(String(u.name).split(" ")[0])}</b>${esc(role())}` : "";
}

function route(soft) {
  if (!DB.state.ready) { app.innerHTML = `<section class="sec wrap"><div class="empty">Loading TravelHaven…</div></section>`; return; }
  const y = window.scrollY;
  tickSubscriptions();
  if (!soft) closeModal();
  if (!/^#chat-/.test(location.hash)) Chat.closeMsgs();
  if (role() === "host" || role() === "admin") Alerts.ensure();
  const h = (location.hash || "#home").slice(1) || "home";
  const [base, ...rest] = h.split("-"); const arg = rest.join("-");
  let page = h;
  const need = base === "admin" ? "admin" : (base === "host" && h !== "host-join") ? "host" : "";
  if (need && role() !== need && !(rest[0] === "edit" && role() === "admin")) { renderAccount(need); nav("account"); if (!soft) window.scrollTo(0, 0); return; }
  if (h === "host-join" && role() === "host") { location.hash = "host"; return; }
  if (h === "home") renderHome();
  else if (h === "search" || h === "buy") { const m = h === "buy" ? "sale" : "stay"; if (state.q.mode !== m) Object.assign(state.q, { mode: m, unit: "", type: "", min: "", max: "", guests: 0, sort: "featured" }); renderSearch(); }
  else if (base === "stay") renderProperty(arg);
  else if (h === "favorites") renderFavorites();
  else if (h === "contact") renderContact();
  else if (h === "inbox") { page = "inbox"; Chat.renderInbox(); }
  else if (base === "chat") { page = "inbox"; Chat.renderChat(arg); }
  else if (h === "account") renderAccount();
  else if (h === "host-join") renderHostJoin();
  else if (h === "host") renderHostDash();
  else if (h === "host-add") renderWizard(null);
  else if (base === "host" && rest[0] === "edit") renderWizard(rest.slice(1).join("-"));
  else if (base === "admin") renderAdmin(arg || "dashboard");
  else { page = "home"; renderHome(); }
  nav(page); window.scrollTo(0, soft ? y : 0);
}

/* ---------- cards ---------- */
function card(p) {
  const host = { name: p.hostName || (DB.find("users", "userId", p.hostId) || {}).name };
  const fav = isFav(p.propertyId);
  const n = +p.photoCount || 0, ci = Math.min((state.cardIdx || {})[p.propertyId] || 0, Math.max(0, (p.photos || []).length - 1));
  return `<a class="card" href="#stay-${p.propertyId}">
    <div class="ph cgal" data-cpid="${p.propertyId}">${photoBox(p, ci)}
      ${n > 1 ? `<button class="cnav prev" data-cardstep="${p.propertyId},-1" aria-label="Previous photo">‹</button><button class="cnav next" data-cardstep="${p.propertyId},1" aria-label="Next photo">›</button>
      <span class="cdots">${Array.from({ length: Math.min(n, 7) }, (_, i) => `<i class="${i === Math.min(ci, 6) ? "on" : ""}"></i>`).join("")}</span>` : ""}${p.featured ? `<span class="badge">Featured</span>` : modeOf(p) === "sale" ? `<span class="badge">For sale</span>` : ""}
      <button class="heart" data-fav="${p.propertyId}" aria-pressed="${fav}" aria-label="${fav ? "Remove from saved" : "Save"}">${fav ? "♥" : "♡"}</button></div>
    <div class="meta">
      <div class="price">${priceHtml(p)}</div>
      <h3>${esc(p.name)}</h3>
      <div class="loc">${esc(p.town)}, ${esc(p.parish)} · ${esc(p.type)}</div>
      <div class="facts">${factsHtml(p)}</div>
      <div class="by"><span class="av">${esc(initials(host.name))}</span><span>${esc(host.name || "Host")}</span><span class="ver">✓ Approved</span></div>
    </div></a>`;
}

/* ---------- search ---------- */
function searchFields(prefix, compact) {
  const q = state.q;
  const parishOpts = `<option value="">All parishes</option>` + C.regions.map(r => `<option ${q.parish === r ? "selected" : ""}>${r}</option>`).join("");
  const sale = q.mode === "sale", per = sale ? "" : " / " + (q.unit ? UNITS[q.unit].per : "night");
  const unitSel = sale ? "" : `<option value="">Any</option>` + Object.keys(UNITS).map(k => `<option value="${k}" ${q.unit === k ? "selected" : ""}>${UNITS[k].label}</option>`).join("");
  const typeOpts = `<option value="">Any type</option>` + typesFor(q.mode).map(t => `<option ${q.type === t ? "selected" : ""}>${t}</option>`).join("");
  const sym = state.cur === "USD" ? "US$" : C.symbol;
  if (compact) return `
    <div class="field"><label for="${prefix}parish">${C.regionLabel}</label><select id="${prefix}parish" data-q="parish">${parishOpts}</select></div>
    <div class="field"><label for="${prefix}town">Town / area</label><input id="${prefix}town" data-q="town" placeholder="e.g. Negril" value="${esc(q.town)}"></div>
    ${sale ? "" : `<div class="field"><label for="${prefix}guests">Guests</label><input id="${prefix}guests" data-q="guests" type="number" min="0" inputmode="numeric" placeholder="Any" value="${q.guests || ""}"></div>`}
    <div class="field"><label for="${prefix}type">Property type</label><select id="${prefix}type" data-q="type">${typeOpts}</select></div>
    ${sale ? "" : `<div class="field"><label for="${prefix}unit">Price type</label><select id="${prefix}unit" data-q="unit">${unitSel}</select></div>`}
    <div class="field"${sale ? ' style="grid-column:span 2"' : ""}><label for="${prefix}max">Max price${per} (${sym})</label><input id="${prefix}max" data-q="max" type="number" min="0" inputmode="numeric" placeholder="Any" value="${esc(q.max)}"></div>`;
  return `<div class="form">
    <div class="r2"><div><label class="f" for="${prefix}parish">${C.regionLabel}</label><select class="in" id="${prefix}parish" data-q="parish">${parishOpts}</select></div>
      <div><label class="f" for="${prefix}town">Town / area</label><input class="in" id="${prefix}town" data-q="town" placeholder="e.g. Negril" value="${esc(q.town)}"></div></div>
    <div class="r2">${sale ? "" : `<div><label class="f" for="${prefix}guests">Guests</label><input class="in" id="${prefix}guests" data-q="guests" type="number" min="0" inputmode="numeric" placeholder="Any" value="${q.guests || ""}"></div>`}
      <div${sale ? ' style="grid-column:1/-1"' : ""}><label class="f" for="${prefix}type">Property type</label><select class="in" id="${prefix}type" data-q="type">${typeOpts}</select></div></div>
    ${sale ? "" : `<div><label class="f" for="${prefix}unit">Price type</label><select class="in" id="${prefix}unit" data-q="unit">${unitSel}</select>${q.unit ? "" : `<p class="fine" style="margin:4px 0 0">Weekly and monthly prices are compared as a nightly amount.</p>`}</div>`}
    <div class="r2"><div><label class="f" for="${prefix}min">Min price${per} (${sym})</label><input class="in" id="${prefix}min" data-q="min" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(q.min)}"></div>
      <div><label class="f" for="${prefix}max">Max price${per} (${sym})</label><input class="in" id="${prefix}max" data-q="max" type="number" min="0" inputmode="numeric" placeholder="Any" value="${esc(q.max)}"></div></div>
    <button class="btn linkbtn" type="button" data-clear style="justify-self:start">Clear filters</button></div>`;
}
function results() {
  const q = state.q, toUsd = v => state.cur === "USD" ? +v : +v / C.rateFromUSD;
  const cmp = p => (q.mode === "sale" || q.unit) ? (+p.price || 0) : perNight(p);
  let r = DB.all("properties").filter(isPublic).filter(p => modeOf(p) === q.mode &&
    (!q.parish || p.parish === q.parish) &&
    (!q.town || (p.town + " " + p.address).toLowerCase().includes(q.town.trim().toLowerCase())) &&
    (q.mode === "sale" || !q.guests || p.maxGuests >= +q.guests) &&
    (!q.type || p.type === q.type) &&
    (q.mode === "sale" || !q.unit || unitOf(p) === q.unit) &&
    (q.min === "" || cmp(p) >= toUsd(q.min)) &&
    (q.max === "" || cmp(p) <= toUsd(q.max)));
  const s = q.sort;
  r.sort((a, b) => s === "lo" ? cmp(a) - cmp(b) : s === "hi" ? cmp(b) - cmp(a) : s === "guests" ? b.maxGuests - a.maxGuests : (!!b.featured - !!a.featured) || b.createdAt - a.createdAt);
  return r;
}

async function createHost(e) {
  e.preventDefault();
  const v = id => $("#" + id) ? $("#" + id).value.trim() : "";
  let ph = digits(v("jPhone")); if (ph.length === 7) ph = "1876" + ph; else if (ph.length === 10) ph = "1" + ph;
  const err = !v("jName") ? "Add your name." : !/^\S+@\S+\.\S+$/.test(v("jEmail")) ? "Add a valid email." : ph.length !== 11 ? "Add a valid phone number, e.g. 876 555 0100." : !$("#jTerms").checked ? "Please confirm you own or manage the properties." : "";
  if (err) { $("#jErr").textContent = err; return; }
  const btn = document.querySelector("#hostJoin button[type=submit]"); btn.disabled = true;
  try {
    let u = me();
    if (!u) {
      const pe = authRule(v("jPass"), v("jEmail")); if (pe) { $("#jErr").textContent = pe; return; }
      DB.state.pendingProfile = true;
      try { const cred = await DB.fx.createUserWithEmailAndPassword(DB.auth, v("jEmail"), v("jPass")); DB.fx.sendEmailVerification(cred.user).catch(() => {}); }
      catch (x) { DB.state.pendingProfile = false; $("#jErr").textContent = authError(x); return; }
      u = { userId: DB.state.user.uid, email: v("jEmail"), country: ACTIVE_COUNTRY, status: "active", createdAt: Date.now() };
    }
    const data = { userId: u.userId, name: v("jName"), email: u.email, phone: "+" + ph, accountType: "host", country: u.country || ACTIVE_COUNTRY, status: u.status || "active", createdAt: u.createdAt || Date.now() };
    const now = Date.now();
    try {
      await DB.writeNow("users", data);
      if (!subOf(u.userId)) await DB.writeNow("subscriptions", { hostId: u.userId, plan: "small", status: "trial", startedAt: now, trialEndsAt: now + TRIAL_DAYS * DAY, currentPeriodEnd: now + TRIAL_DAYS * DAY, autoRenew: true, failedAttempts: 0, history: [] });
    } catch (x) { DB.state.pendingProfile = false; $("#jErr").textContent = "Couldn't create your host account. Please try again."; return; }
    DB.state.pendingProfile = false;
    await DB.waitFor(() => role() === "host" && subOf(u.userId));
    toast(`Welcome! Your ${TRIAL_DAYS}-day free period has started.`);
    go("host-add");
  } finally { if (btn.isConnected) btn.disabled = false; }
}

/* Turn any phone photo into a small JPEG. Tries the fastest decoder first, then falls back. */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, done: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url);
      const r = new FileReader(); r.onload = () => { const i2 = new Image(); i2.onload = () => res({ img: i2, done() {} }); i2.onerror = rej; i2.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); };
    img.src = url;
  });
}
async function shrink(file) {
  try {
    let src, w, h, done = () => {};
    if (window.createImageBitmap) {
      try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; done = () => src.close && src.close(); } catch (e) { src = null; }
    }
    if (!src) { const r = await loadImage(file); src = r.img; w = r.img.naturalWidth; h = r.img.naturalHeight; done = r.done; }
    if (!w || !h) throw new Error("empty");
    const scale = Math.min(1, 1200 / Math.max(w, h)), c = document.createElement("canvas");
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); done();
    let q = .72, out = c.toDataURL("image/jpeg", q);
    while (out.length > 700000 && q > .4) { q -= .1; out = c.toDataURL("image/jpeg", q); } // keep each photo well under the database's 1 MB limit
    return out;
  } catch (e) { return null; }
}

function adminAnalytics() {
  const E = DB.all("events"), since = Date.now() - 30 * DAY, recent = E.filter(e => e.at >= since);
  const x = stats(null, 30);
  const days = [...Array(14)].map((_, i) => { const s = Date.now() - (13 - i) * DAY, d0 = new Date(s); d0.setHours(0, 0, 0, 0); const a = +d0, b = a + DAY; return recent.filter(e => e.type === "view" && e.at >= a && e.at < b).length; });
  const maxD = Math.max(1, ...days);
  const src = {}; recent.filter(e => e.type === "view").forEach(e => src[e.source] = (src[e.source] || 0) + 1);
  const srcRows = Object.entries(src).sort((a, b) => b[1] - a[1]), maxS = Math.max(1, ...srcRows.map(r => r[1]));
  const byProp = DB.all("properties").map(p => ({ p, s: stats(p.propertyId, 30) })).filter(r => r.s.view).sort((a, b) => b.s.view - a.s.view);

      <div class="kpi"><span>Phone clicks</span><b>${x.phone}</b></div>
      <div class="kpi"><span>Email clicks</span><b>${x.email}</b></div>
      <div class="kpi"><span>Contact rate</span><b>${ctr}%</b></div></div>
    <p class="fine">Last 30 days.</p>
    <div class="panel" style="margin-top:16px"><h3>Views per day · last 14 days</h3>
      <div class="spark" role="img" aria-label="Daily views, last 14 days: ${days.join(", ")}">${days.map(v => `<i style="height:${Math.round(v / maxD * 100)}%" title="${v} views"></i>`).join("")}</div></div>
    <div class="panel"><h3>Traffic source</h3><div class="bars">${srcRows.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><div class="t"><i style="width:${v / maxS * 100}%"></i></div><em>${v}</em></div>`).join("") || `<p class="fine">No traffic yet.</p>`}</div></div>
    <div class="panel"><h3>By property</h3><div class="list" style="border:0">${byProp.map(({ p, s }) => `<div class="item" style="padding-inline:0"><div class="mid"><b>${esc(p.name)}</b>
      <div class="stats"><span><b>${s.view}</b> views</span><span><b>${s.booking}</b> booking</span><span><b>${s.whatsapp}</b> WhatsApp</span><span><b>${s.phone}</b> phone</span><span><b>${s.email}</b> email</span></div></div></div>`).join("") || `<p class="fine">No views yet.</p>`}</div></div>`;
}

/* =========================================================
   AUTH helpers. Firebase Authentication stores and checks
   passwords securely, sends reset and confirmation emails,
   and slows down repeated wrong guesses.
   ========================================================= */
function authRule(pw, email) {
  if (!pw || pw.length < 8) return "Use at least 8 characters for your password.";
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return "Your password needs at least one letter and one number.";
  const name = String(email || "").split("@")[0].toLowerCase();
  if (name.length > 3 && pw.toLowerCase().includes(name)) return "Don't use your email name in your password.";
  if (/^(password|12345678|qwerty12|abc12345)/i.test(pw)) return "That password is too easy to guess.";
  return "";
}
function authError(e) {
  const c = (e && e.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-login")) return "Email or password is wrong.";
  if (c.includes("too-many-requests")) return "Too many tries. Wait a few minutes, or reset your password.";
  if (c.includes("email-already-in-use")) return "That email already has an account. Sign in instead.";
  if (c.includes("invalid-email")) return "Add a valid email.";
  if (c.includes("weak-password")) return "That password is too weak.";
  if (c.includes("network")) return "No connection. Check your internet and try again.";
  if (c.includes("user-disabled")) return "This account is disabled. Contact TravelHaven support.";
  if (c.includes("requires-recent-login")) return "For your security, sign out and back in, then try again.";
  return "Something went wrong. Please try again.";
}
const pwHint = `<p class="fine" style="margin:4px 0 0">At least 8 characters, with a letter and a number.</p>`;
function pwInput(id, label, ac, extra) {
  return `<div><div style="display:flex;justify-content:space-between;align-items:end"><label class="f" for="${id}">${label}</label>
    <button type="button" class="linkbtn" data-showpw="${id}" style="font-size:12px;margin-bottom:4px">Show</button></div>
    <input class="in" id="${id}" type="password" autocomplete="${ac}" required>${extra || ""}</div>`;
}
function openForgot(prefill) {
  modal(`<h3>Reset your password</h3>
    <form class="form" id="forgotForm"><p class="fine" style="margin:0">Enter your account email and we'll email you a link to choose a new password.</p>
      <div><label class="f" for="fEmail">Email</label><input class="in" id="fEmail" type="email" autocomplete="email" required value="${esc(prefill || "")}"></div>
      <div class="err" id="fErr" role="alert"></div>
      <button class="btn solid" type="submit">Send reset link</button></form>`);
}
async function forgotSubmit() {
  const email = $("#fEmail").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $("#fErr").textContent = "Add a valid email."; return; }
  try { await DB.fx.sendPasswordResetEmail(DB.auth, email); } catch (e) { if (!/user-not-found/.test(e.code || "")) { $("#fErr").textContent = authError(e); return; } }
  modal(`<h3>Check your email</h3><p>If an account exists for <b>${esc(email)}</b>, we've sent a link to reset your password. Check your spam folder if you don't see it.</p>
    <button class="btn solid" data-close style="margin-top:10px">OK</button>`);
}

/* =========================================================

function when(t) {

  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dayLabel(t) {

/* =========================================================
   EMAIL ALERTS (EmailJS, free plan). The admin saves the EmailJS
   IDs in Admin. Each person's alert address is stored where only
   their chat partner can read it:
     properties/{pid}/alert/host   (readable once you have a chat about that listing)
     threads/{tid}/alert/guest     (readable by the two people in the chat)
   One email per batch: only when the other person had no unread messages.
   ========================================================= */
const Alerts = (() => {
  let cfg = null, cfgLoaded = false, lastErr = ""; const done = new Set();
  async function config(force) {
    if (cfgLoaded && !force) return cfg;
    try { const s = await getDoc(doc(DB.fs, "settings", "emailjs")); cfg = s.exists() ? s.data() : null; } catch (e) { cfg = null; }
    cfgLoaded = true; if (location.hash === "#admin") route(true); return cfg;
  }
  const ready = c => c && c.serviceId && c.templateId && c.publicKey;
  const wants = () => { const u = me(); return !(u && u.emailAlerts === false); };
  /* hosts: keep an alert address on each of their listings */
  function ensure(force) {
    const a = DB.state.user, u = me(); if (!a || !u) return;
    DB.all("properties").filter(p => p.hostId === a.uid).forEach(p => {
      if (done.has(p.propertyId) && !force) return; done.add(p.propertyId);
      setDoc(doc(DB.fs, "properties", p.propertyId, "alert", "host"), { email: a.email, name: u.name || "", on: wants() }).catch(() => done.delete(p.propertyId));
    });
  }
  async function guestAlert(tid) {
    const a = DB.state.user, u = me(); if (!a) return;
    try { await setDoc(doc(DB.fs, "threads", tid, "alert", "guest"), { email: a.email, name: u.name || "", on: wants() }); } catch (e) {}
  }
  /* turn my alerts on/off everywhere */
  async function setMine(on) {
    const u = me(); if (!u) return;
    DB.update("users", "userId", u.userId, { emailAlerts: on });
    ensure(true);
    for (const t of Chat.threadsList()) if (t.guestId === u.userId) guestAlert(t.threadId);
  }
  async function send(to, params) {
    const c = await config(); lastErr = !ready(c) ? "The three IDs aren't saved yet." : ""; if (!ready(c) || !to || !to.email || to.on === false) return false;
    try {
      const r = await fetch("https://api.emailjs.com/api/v1.0/email/send", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ service_id: c.serviceId, template_id: c.templateId, user_id: c.publicKey,
          template_params: Object.assign({ to_email: to.email, to_name: to.name || "there", site: "TravelHaven" }, params) }) });
      if (!r.ok) lastErr = (await r.text().catch(() => "")) || ("Error " + r.status);
      return r.ok;
    } catch (e) { lastErr = "No connection to EmailJS (" + (e.message || e) + ")"; return false; }
  }
  /* called after I send a message; t = thread, wasUnread = the other person's unread count before this message */
  async function notify(t, text, wasUnread) {
    if (wasUnread > 0) return; // they already have an email waiting
    const iAmGuest = t.guestId === (DB.state.user && DB.state.user.uid);
    if (Date.now() - (+t[iAmGuest ? "seenHost" : "seenGuest"] || 0) < 3 * 60e3) return; // they're reading the chat right now
    let to = null;
    try { const s = await getDoc(iAmGuest ? doc(DB.fs, "properties", t.propertyId, "alert", "host") : doc(DB.fs, "threads", t.threadId, "alert", "guest")); to = s.exists() ? s.data() : null; } catch (e) {}
    if (!to) return;
    const link = location.origin + location.pathname + "#chat-" + t.threadId;
    send(to, { from_name: iAmGuest ? t.guestName : t.hostName, listing: t.propertyName, message: String(text).slice(0, 400), link });
  }
  async function test(email) {
    return send({ email, name: (me() || {}).name || "Admin", on: true }, { from_name: "TravelHaven", listing: "Test listing", message: "This is a test email alert from TravelHaven. If you got this, email alerts are working.", link: location.origin + location.pathname + "#inbox" });
  }
  async function saveConfig(c) { await setDoc(doc(DB.fs, "settings", "emailjs"), c); cfg = c; cfgLoaded = true; }
  return { config, ensure, guestAlert, setMine, notify, test, saveConfig, ready, get cfg() { return cfg; }, get lastErr() { return lastErr; } };
})();

document.addEventListener("touchstart", e => { const b = e.target.closest(".cgal"); cardPid = b && b.querySelector(".cnav") ? b.dataset.cpid : null; if (cardPid) { cardX = e.touches[0].clientX; cardY = e.touches[0].clientY; } }, { passive: true });
document.addEventListener("touchend", e => {
  if (!cardPid) return; const dx = e.changedTouches[0].clientX - cardX, dy = e.changedTouches[0].clientY - cardY, pid = cardPid; cardPid = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { cardSwiped = true; setTimeout(() => cardSwiped = false, 400); cardStep(pid, dx < 0 ? 1 : -1); }
}, { passive: true });
document.addEventListener("click", e => { if (cardSwiped && e.target.closest(".cgal")) { e.preventDefault(); e.stopPropagation(); } }, true);

</script>
</body>
</html>
